<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Открытый цифровой архив семейной, школьной и городской памяти. Демонстрационный проект школьного конкурса «Мы помним связь поколений»."
    />
    <title>Мы помним связь поколений</title>
    <script>
      // Ставим тему до первой отрисовки, чтобы избежать «мигания» светлой вёрстки.
      (function () {
        try {
          var stored = localStorage.getItem('portal-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
