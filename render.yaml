# Депloy на Render: New → Blueprint → выбрать этот репозиторий.
# Сайт, админка и API будут работать на одном адресе *.onrender.com.
services:
  - type: web
    name: svyaz-pokoleniy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

# Важно о бесплатном плане Render:
# - файловая система эфемерная: SQLite-база и загрузки создаются заново при
#   каждом деплое/перезапуске, сайт откатится к начальным данным из seed.
# - Чтобы данные сохранялись, возьмите платный план с Persistent Disk и
#   раскомментируйте блоки ниже (диск монтируется в /var/data):
#
# disk:
#   name: svyaz-data
#   mountPath: /var/data
#   sizeGB: 1
#
# и добавьте в envVars:
#       - key: DB_PATH
#         value: /var/data/app.db
#       - key: UPLOADS_DIR
#         value: /var/data/uploads
