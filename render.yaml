# Деплой на Render: New → Blueprint → выбрать этот репозиторий.
# Сайт, админка и API будут работать на одном адресе *.onrender.com.
services:
  - type: web
    name: svyaz-pokoleniy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Постоянное хранение данных: значений нет в репозитории (секреты),
      # заполняются при развёртывании Blueprint или в настройках сервиса.
      #  - TURSO_URL / TURSO_AUTH_TOKEN — база Turso (https://app.turso.tech):
      #    проекты, статусы, администратор и файлы участников (таблица files)
      #    переживают рестарты и деплои. Без них всё лежит на эфемерном диске
      #    и стирается при каждом рестарте бесплатного плана.
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

# Если TURSO_* не задать, всё работает по-старому: проекты и файлы лежат
# в локальном SQLite-файле на диске сервиса, который стирается при каждом
# рестарте/деплое бесплатного плана (сайт откатится к данным из seed).
#
# Альтернатива без Turso — платный план + Persistent Disk:
# раскомментируйте блок ниже и задайте DB_PATH (в файл базы попадут
# и проекты, и файлы участников):
#
# disk:
#   name: svyaz-data
#   mountPath: /var/data
#   sizeGB: 1
#
#       - key: DB_PATH
#         value: /var/data/app.db
#       - key: UPLOADS_DIR
#         value: /var/data/uploads
